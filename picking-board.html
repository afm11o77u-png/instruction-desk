<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ピッキングの一覧 | 指示書デスク</title><link rel="stylesheet" href="/picking.css"><link rel="icon" href="/favicon.png"></head><body>
<header><strong id="boardtitle">ピッキングの一覧</strong><span id="who"></span></header>
<main class="histpage boardpage"><nav class="boardswitch"><a data-bucket="waiting" href="/picking-board?bucket=waiting">保存済み・手配未完了</a><a data-bucket="sheets" href="/picking-board?bucket=sheets">未取り込み</a><a href="/picking-history">保存した依頼</a></nav><p class="hint">このページは、作成画面とは別です。上の件数から開いた確認用の一覧です。確認後はこのタブを閉じると、作成画面へ戻れます。この画面を開いても、作成画面の入力や除外は変わりません。</p><div id="message" role="status" aria-live="polite"></div>
<section id="boardlist"><h1 id="boardheading">一覧</h1><p id="boardlead" class="hint"></p>
<div class="homefilters"><label id="fromwrap" hidden>マーク出荷日 から<input id="boardfrom" type="date"></label><label id="towrap" hidden>まで<input id="boardto" type="date"></label><label>検索<input id="boardq" type="search" placeholder="保存名・顧客名・依頼者・リスト番号"></label><button type="button" id="boardsearch">検索</button><button type="button" id="boardclear">条件をクリア</button></div>
<p id="boardcounts" class="hint"></p><p id="boardrange" class="hint"></p>
<div id="boardbody" class="boardwrap"><p>読み込み中</p></div>
<div class="rowtools"><button type="button" id="boardprev">前のページ</button><span id="boardpager"></span><button type="button" id="boardnext">次のページ</button></div></section>
</main><script src="/picking-board.js"></script></body></html>
