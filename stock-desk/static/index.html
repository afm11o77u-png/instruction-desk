<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>在庫管理（試用）</title>
<script>if(new URLSearchParams(location.search).get('embed')==='1')document.documentElement.classList.add('embed')</script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="display-mode.css">
</head>
<body>
<header class="stockhead">
  <div class="stockhead-brand">
    <p class="eyebrow" id="eyebrow">試用版</p>
    <h1 id="stocktitle">在庫一覧</h1>
  </div>
  <nav class="tabs" id="tabs" aria-label="登録・設定" hidden></nav>
  <nav class="switch" aria-label="画面の切替">
    <button type="button" data-mode="masters">顧客・商品情報</button>
    <button type="button" data-mode="stock">在庫管理</button>
    <button type="button" id="desk">指示書デスク</button>
  </nav>
</header>
<p id="desknote" class="notice" hidden>指示書デスクは、この試用アプリには入っていません。</p>
<main id="main"></main>
<footer>
  <button type="button" id="backup" class="quiet">バックアップを作る</button>
  <span id="foot"></span>
</footer>
<dialog id="openingDialog" class="opening-dialog"></dialog>
<dialog id="dialog"></dialog>
<p id="toast" hidden></p>
<script src="display-mode.js"></script>
<script src="opening_pickers.js"></script>
<script src="app.js"></script>
</body>
</html>
