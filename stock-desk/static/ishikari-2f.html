<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>石狩倉庫2F 棚番号</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;font:15px/1.55 "Meiryo",sans-serif;background:#f4f7f4;color:#203b30}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-size:24px;margin:0}h2{font-size:19px;margin:20px 0 10px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
a{color:#185b3b}header a{padding:7px 12px;border:1px solid #b9d1c3;border-radius:7px;background:#fff;text-decoration:none}
.map-scroll,.table-scroll{overflow:auto;background:#fff;border:1px solid #c7d9cd;border-radius:8px}
.table-scroll{width:fit-content;max-width:100%}
.map{display:grid;width:max-content;padding:12px}
.cell{display:flex;align-items:center;justify-content:center;text-align:center;min-width:0;min-height:0;overflow:hidden;padding:2px;line-height:1.18}
.cell span{overflow-wrap:anywhere;white-space:pre-line;max-width:100%}
.cell.vertical{position:relative}.cell.vertical span{position:absolute;width:max-content;max-width:none;transform:rotate(-90deg);white-space:nowrap}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:10px}
input{font:inherit;padding:6px 8px;border:1px solid #a7c1b1;border-radius:5px}
table{border-collapse:collapse;width:auto}
th,td{padding:7px 10px;border-bottom:1px solid #dce8df;text-align:left;white-space:nowrap}
th{background:#e2eee5}
#items td:first-child{white-space:normal;min-width:8em;max-width:15em}
[hidden]{display:none!important}
body.editing{padding-bottom:90px}
.cell.selected{outline:3px solid #d9822b;outline-offset:-2px;z-index:2}
body.editing .cell{cursor:move;touch-action:none;user-select:none}
body.editing .map{touch-action:none}
.cell .resize{position:absolute;right:0;bottom:0;width:12px;height:12px;background:#d9822b;cursor:nwse-resize;z-index:3}
.cell.selected:not(.vertical){position:relative}
header button,#block-editor button,#editbar button,#directory button{font:inherit;padding:7px 12px;border:1px solid #b9d1c3;border-radius:7px;background:#fff;color:#185b3b;cursor:pointer}
button.primary{background:#185b3b!important;color:#fff!important;border-color:#185b3b!important}
button:disabled{opacity:.5;cursor:default}
#load-note{margin:-8px 0 12px;font-size:13px;color:#4d6b5c;min-height:1em}
#block-editor{margin-top:14px;background:#fff;border:1px solid #c7d9cd;border-radius:8px;padding:10px 14px}
#block-editor h2{margin:4px 0 8px}#block-editor h3{font-size:15px;margin:12px 0 6px}
.fieldrow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.fieldrow label{display:flex;flex-direction:column;font-size:13px;gap:2px}
.fieldrow label.check{flex-direction:row;align-items:center;gap:4px}
.fieldrow input[type=number]{width:80px}.fieldrow textarea{font:inherit;width:260px;padding:6px 8px;border:1px solid #a7c1b1;border-radius:5px}
.hint{font-size:13px;color:#4d6b5c;margin:4px 0}.hint.warn{color:#a3261b;font-weight:700}
table.linked{min-width:0;width:auto}table.linked input{width:150px}
#items input{box-sizing:content-box;padding:4px 6px}
#item-add{margin-top:10px}
#editbar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 20px;background:#fffbe9;border-top:2px solid #d9822b;z-index:10}
.map-wrap{position:relative;width:max-content}
#route-layer{position:absolute;left:0;top:0;pointer-events:none;z-index:4;overflow:visible}
body.route-input .map .cell{cursor:crosshair}
#route-box{margin-top:14px}#route-box .check{display:inline-flex;align-items:center;gap:4px}
#route-editor{background:#fff;border:1px solid #c7d9cd;border-radius:8px;padding:10px 14px;margin-top:8px}#route-editor h2{margin:4px 0 8px}
#route-editor button{font:inherit;padding:7px 12px;border:1px solid #b9d1c3;border-radius:7px;background:#fff;color:#185b3b;cursor:pointer}
#route-list{margin:6px 0;padding-left:0;list-style:none;max-height:360px;overflow:auto}#route-list li{display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid #e3ece6}
#route-list li b{min-width:2.4em;text-align:right}#route-list li span{flex:1}#route-list li button{padding:2px 8px}
#items td.op{white-space:nowrap}#items .mismatch{margin-left:6px;color:#a3261b;font-weight:700;font-size:13px}#items td.op button+span+button{margin-left:4px}
.link-note{color:#185b3b!important;font-weight:700}
#edit-status{flex:1;min-width:200px;font-weight:700}
</style>
</head>
<body>
<header><h1>石狩倉庫2F 棚番号</h1><nav class="actions" aria-label="棚番号メニュー"><a href="#directory">棚番号一覧へ</a><a href="ishikari-2f.xlsx" download="石狩倉庫2F_棚番号.xlsx">Excelをダウンロード</a><button type="button" id="edit-toggle" hidden>編集モード</button></nav></header>
<p id="load-note" role="status"></p>
<section aria-label="棚番号配置図"><div class="map-scroll" tabindex="0" aria-label="配置図。横へスクロールできます"><div class="map-wrap"><div class="map" id="map"></div><svg id="route-layer" aria-hidden="true"></svg></div></div></section>
<section id="block-editor" hidden aria-label="ブロックの編集"><h2>配置図のブロックの編集</h2><div class="actions"><button type="button" id="block-add">＋ ブロックを追加</button><button type="button" id="block-copy">選んだブロックを複製</button><button type="button" id="block-delete">選んだブロックを削除</button></div><div id="block-fields"></div></section>
<section id="route-box" aria-label="ルート"><div class="actions"><label class="check"><input type="checkbox" id="route-show"> ルートを表示</label><span id="route-summary" class="hint"></span></div>
<div id="route-editor" hidden><h2>ルート入力</h2><div class="actions"><button type="button" id="route-mode">ルート入力を始める</button><button type="button" id="route-clear">ルートを全部消す</button><button type="button" id="route-undo" disabled title="直前のルート操作を取り消します（Ctrl+Z）">1つ戻す</button></div><p id="route-msg" class="hint" role="status"></p><ol id="route-list"></ol></div></section>
<section id="directory"><h2>棚番号一覧</h2><div class="controls"><label for="search">名称・棚番号で検索</label><input type="search" id="search"><span id="count" role="status"></span></div>
<div class="table-scroll" tabindex="0"><table><thead><tr><th>名称</th><th>棚番号</th><th>名称別の枝番号</th><th>棚全体の枝番号</th><th>ラック</th><th>確認事項</th><th id="items-head-op" hidden>操作</th></tr></thead><tbody id="items"></tbody></table></div>
<button type="button" id="item-add" hidden>＋ 行を追加</button></section>
<div id="editbar" hidden><span id="edit-status" role="status"></span><label><input type="checkbox" id="link-names" checked> 図と一覧を連動する（名称・棚番号・追加・削除）</label><button type="button" id="edit-cancel">取消（保存済みに戻す）</button><button type="button" id="edit-save" class="primary">保存</button></div>
<script src="ishikari-2f.js?v=20261126_link"></script>
</body>
</html>
