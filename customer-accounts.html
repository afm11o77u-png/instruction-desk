<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>顧客ID管理</title><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/customer-accounts.css"><main><a href="/">← 社内画面へ戻る</a><h1>顧客ID管理</h1><p class="notice">顧客用IDの準備・管理画面です。社内の利用者管理とは別管理です。<br>現在はWEB依頼へのログイン・注文に接続していません。メールも送信しません。</p><button id="new">顧客IDを追加</button><label>一覧を検索<input id="search" placeholder="顧客名・担当者名・メールアドレス"></label><p id="message" role="status"></p><div class="table"><table><thead><tr><th>顧客</th><th>担当者</th><th>ログインID（メール）</th><th>通知先</th><th>状態</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></main><dialog id="editor"><form id="form"><h2 id="title"></h2><label>顧客<select name="customer_id" required></select></label><label>担当者名<input name="name" maxlength="80" required></label><label>ログインID（メールアドレス）<input name="email" type="email" maxlength="254" required autocomplete="off"></label><label>通知先メール（空欄ならログインIDと同じ）<input name="notification_email" type="email" maxlength="254"></label><label>利用状態<select name="active"><option value="1">有効</option><option value="0">停止</option></select></label><section id="passwords"><p>パスワードは12～128文字。保存後は表示できません。</p><label>パスワード<input name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password"></label><label>パスワードの確認<input name="confirm" type="password" autocomplete="new-password"></label></section><p id="error" role="alert"></p><button type="submit">保存</button> <button type="button" id="cancel">キャンセル</button></form></dialog><script src="/customer-accounts.js"></script></html>
