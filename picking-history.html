<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>保存した依頼 | 指示書デスク</title><link rel="stylesheet" href="/picking.css"><link rel="icon" href="/favicon.png"></head><body>
<header><strong>保存した依頼</strong><span id="who"></span></header>
<main class="histpage"><p class="hint">確認後はこのタブを閉じて、作成画面へ戻れます。この画面を開いても、作成画面の入力は変わりません。</p><div id="message" role="status" aria-live="polite"></div>
<section id="histlist"><h1>保存した依頼</h1><p class="hint">保存したすべての依頼を表示します。手配前は「編集・手配」から修正できます。手配完了した内容は変更できません。日付は依頼日です。指示書のマーク出荷日ではありません。状態で、メールの要否と手配完了の方法を区別します。</p>
<div class="homefilters"><label>依頼日 から<input id="histfrom" type="date"></label><label>まで<input id="histto" type="date"></label><label>検索<input id="histq" type="search" placeholder="顧客名・依頼者・確認先・リスト番号・保存名"></label><label>状態<select id="histkind"><option value="">すべての保存した依頼</option><option value="waiting">保存済み・手配未完了</option><option value="sent">手配完了</option></select></label><button type="button" id="histsearch">検索</button><button type="button" id="histclear">条件をクリア</button></div>
<p id="histcounts" class="hint"></p><p id="histrange" class="hint"></p>
<div id="histbody" class="boardwrap"><p>読み込み中</p></div>
<div class="rowtools"><button type="button" id="histprev">前のページ</button><span id="histpager"></span><button type="button" id="histnext">次のページ</button></div></section>
<section id="histdetail" hidden><button type="button" id="histreturn" class="histback">一覧へ戻る</button><h1 id="dtitle">依頼の詳細</h1><p id="dphase" class="phase"></p><a id="dedit" class="histback" hidden>編集・メール作成</a><div id="dfacts" class="histfacts"></div><div id="dtabs" class="grouptabs"></div><div id="drows" class="tablewrap"></div><h2>記録</h2><div id="dmail"></div><h2>変更履歴</h2><div id="dlog"></div><div class="rowtools" id="doutput"></div><details id="dadmin" hidden><summary>管理操作</summary><p class="hint">日常の新規作成ではありません。権限がある場合だけ操作できます。</p><div class="rowtools"><button type="button" id="dcancel" class="danger" hidden>このリストを削除</button></div><div id="downer" hidden><label>確認用<select id="dflag" aria-label="確認用" hidden></select></label></div></details></section>
</main><div id="printarea"></div><script src="/picking-history.js"></script></body></html>
